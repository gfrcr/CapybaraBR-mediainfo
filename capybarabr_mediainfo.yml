---
id: capybarabr_mediainfo
name: CapybaraBR Media Info (API)
description: "CapybaraBR is a BRAZILIAN Private Torrent Tracker for MOVIES / TV / GENERAL"
language: pt-BR
type: private
encoding: UTF-8
links:
  - https://capybarabr.com/

caps:
  categorymappings:
    - {id: 1, cat: Movies, desc: "Filmes"}
    - {id: 2, cat: TV, desc: "Series"}
    - {id: 4, cat: TV/Anime, desc: "Animes"}
    - {id: 8, cat: TV/Sport, desc: "Esportes"}
    - {id: 6, cat: Movies, desc: "Desenhos Animados"}
    - {id: 5, cat: Console, desc: "Jogos"}
    - {id: 9, cat: PC, desc: "Programas"}
    - {id: 10, cat: Books/Comics, desc: "HQs"}
    - {id: 11, cat: Books/EBook, desc: "Livros"}
    - {id: 12, cat: Other, desc: "Cursos"}
    - {id: 13, cat: Books/Mags, desc: "Revistas"}

  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid, tvdbid, tmdbid]
    movie-search: [q, imdbid, tmdbid]
    music-search: [q]
    book-search: [q]

settings:
  - name: apikey
    type: text
    label: APIKey
  - name: info_key
    type: info
    label: About your API key
    default: "Find or Generate a new API Token by accessing your <a href=\"https://capybarabr.com/\" target=\"_blank\">CapybaraBR</a> account <i>My Settings</i> page and clicking on the <b>API Key</b> tab."
  - name: freeleech
    type: checkbox
    label: Search freeleech only
    default: false
  - name: use_single_file_release_use_filename
    type: checkbox
    label: Use filename as the title for single file releases
    default: false
  - name: sort
    type: select
    label: Sort requested from site
    default: created_at
    options:
      created_at: created
      seeders: seeders
      size: size
      name: title
  - name: type
    type: select
    label: Order requested from site
    default: desc
    options:
      desc: desc
      asc: asc
  - name: info_activity
    type: info
    label: Account Inactivity
    default: "The system automatically makes an account inactive when not logged in for a period of 90 days. So just log in within this time so that it is not inactivated."
  - name: use_media_info
    type: checkbox
    default: false
    label: Extract Mediainfo language
  - name: use_media_info_on_rss
    type: checkbox
    default: false
    label: Extract Mediainfo language on RSS/feed
  - name: media_info_per_page
    type: select
    label: Results per page when Mediainfo is enabled
    default: "30"
    options:
      "20": "20"
      "30": "30"
      "50": "50"
      "100": "100"

  - name: title_language_mode
    type: select
    label: Languages appended to release title
    default: br_en_jp
    options:
      br_en_jp: Brazilian, English and Japanese only
      br_en: Brazilian and English only
      br_only: Brazilian only
      all: All mapped audio languages
      none: Do not append audio languages

login:
  path: /api/torrents
  method: get
  inputs: {} # TODO: remove in v10
  error:
    - selector: a[href*="/login"]
      message:
        text: "The API key was not accepted by {{ .Config.sitelink }}."
    - selector: :root:contains("Account is Banned")

search:
  paths:
    # https://hdinnovations.github.io/UNIT3D/torrent_api.html
    # https://github.com/HDInnovations/UNIT3D/blob/master/app/Http/Controllers/API/TorrentController.php#L657
    - path: api/torrents/filter
      response:
        type: json

  headers:
    Authorization: ["Bearer {{ .Config.apikey }}"]

  inputs:
    # if we have an id based search, add Season and Episode as query in name for UNIT3D < v6. Else pass S/E Params for UNIT3D >= v6
    $raw: "{{ range .Categories }}&categories[]={{.}}{{end}}"
    name: "{{ .Keywords }}"
    seasonNumber: "{{ .Query.Season }}"
    episodeNumber: "{{ .Query.Ep }}"
    imdbId: "{{ .Query.IMDBIDShort }}"
    tmdbId: "{{ .Query.TMDBID }}"
    tvdbId: "{{ .Query.TVDBID }}"
    "free[]": "{{ if .Config.freeleech }}100{{ else }}{{ end }}"
    sortField: "{{ .Config.sort }}"
    sortDirection: "{{ .Config.type }}"
    # MediaInfo em lote grande é pesado. Em RSS/feed, mantém página baixa e pula parsing por padrão.
    perPage: "{{ if .Config.use_media_info }}{{ if .Query.IsRssSearch }}{{ if .Config.use_media_info_on_rss }}{{ .Config.media_info_per_page }}{{ else }}20{{ end }}{{ else }}{{ .Config.media_info_per_page }}{{ end }}{{ else }}100{{ end }}"

  keywordsfilters:
    - name: re_replace
      args: ["\\.", " "]

  rows:
    selector: data
    attribute: attributes

  fields:
    languages: # Audio languages extracted from MediaInfo and normalized for *Arr parsing.
      selector: media_info
      optional: true
      filters:
        # Só extrai MediaInfo se use_media_info estiver ligado.
        # Em RSS/feed, só extrai se use_media_info_on_rss também estiver ligado.
        - name: re_replace
          args: ['(?s)(.*)', '{{ if .Config.use_media_info }}{{ if .Query.IsRssSearch }}{{ if .Config.use_media_info_on_rss }}$1{{ else }}{{ end }}{{ else }}$1{{ end }}{{ else }}{{ end }}']
        - name: re_replace
          args: ['(?s)^(?![\s\S]*Audio\s+(#\d+)?)[\s\S]*$', '']
        - name: re_replace
          args: ['(?s)^(?![\s\S]*Language)[\s\S]*$', '']
        - name: re_replace
          args: ['\r', '']
        - name: re_replace
          args: ['(?s)(.*(?:Audio\s+(#\d+)?.*?(?:Language[^\n]+))).*', "$1\n"]
        - name: re_replace
          args: ['(?s).*?(Audio\s+(#\d+)?.*?(?:Language[^\n]+))', "\n$1"]
        - name: re_replace
          args: ['(?m)^(?!.*\bLanguage\b).*\n', '']
        - name: re_replace
          args: ['(?s)^(?!.*Language\s*:).*|Language\s*:\s*', '']
        - name: re_replace
          args: ['^\s+|\s+$', '']

        # Aliases comuns antes do cleanup de nomes compostos.
        - name: re_replace
          args: ['(?i)\b(PT[-_. ]?BR|BR[-_. ]?PT|Portugu[eê]s\s*Brasil(?:eiro)?|Brazilian\s*Portuguese|Portuguese\s*BR|Portuguese-BR|BR\s*Audio)\b', 'Portuguese (Brazil)']
        - name: re_replace
          args: ['(?i)\b(PT[-_. ]?PT|Portugu[eê]s\s*Portugal|Portuguese\s*Portugal|European\s*Portuguese)\b', 'Portuguese (Portugal)']
        - name: re_replace
          args: ['(?i)\b(ES[-_. ]?LA|LATAM|Latin\s*American\s*Spanish|Spanish\s*Latino|Spanish\s*\(Latin\s*America\))\b', 'Spanish (Latino)']
        - name: re_replace
          args: ['(?i)\b(Chinese\s*Simplified|Simplified\s*Chinese)\b', 'Chinese (Simplified)']
        - name: re_replace
          args: ['(?i)\b(Chinese\s*Traditional|Traditional\s*Chinese)\b', 'Chinese (Traditional)']
        - name: re_replace
          args: ['(?i)\b(French\s*Canadian|Canadian\s*French)\b', 'French (Canada)']
        - name: re_replace
          args: ['(?i)(JA[-_. ]?JP|JPN|Japanese\s*\(Japan\)|Japon[eê]s|日本語)', 'Japanese']

        # Mantém nomes compostos conhecidos; idiomas simples caem no \w+.
        - name: re_replace
          args: ['(?i)((?:Portuguese\s*\(Brazil\)|Portuguese\s*\(Portugal\)|Spanish\s*\(Latino\)|French\s*\(Canada\)|Chinese\s*\(Simplified\)|Chinese\s*\(Traditional\)|Norwegian\s*Bokm[aå]l|Norwegian\s*Nynorsk|English\s*\(US\)|English\s*\(GB\)|English\s*\(UK\)|Mandarin\s*Chinese|\w+)).*', '$1']
        - name: re_replace
          args: ['(?i)English\s*\((?:US|GB|UK)\)', 'English']
        - name: re_replace
          args: ['(?i)Mandarin\s*Chinese', 'Mandarin']
        - name: re_replace
          args: ['(?i)Norwegian\s*Bokm[aå]l', 'Norwegian Bokmal']
        - name: re_replace
          args: ['(?i)\bPortuguese\b(?!\s*\((?:Brazil|Portugal)\))', 'Portuguese (Brazil)']
        - name: re_replace
          args: ['[\n]+', ', ']
        - name: re_replace
          args: ['\b([^,]+)(?:,\s*\1)+', '$1']

    subs: # Subtitle languages extracted from MediaInfo. Kept out of title to avoid false audio matches.
      selector: media_info
      optional: true
      filters:
        # Só extrai MediaInfo se use_media_info estiver ligado.
        # Em RSS/feed, só extrai se use_media_info_on_rss também estiver ligado.
        - name: re_replace
          args: ['(?s)(.*)', '{{ if .Config.use_media_info }}{{ if .Query.IsRssSearch }}{{ if .Config.use_media_info_on_rss }}$1{{ else }}{{ end }}{{ else }}$1{{ end }}{{ else }}{{ end }}']
        - name: re_replace
          args: ['(?s)^(?![\s\S]*Text\s+(#\d+)?)[\s\S]*$', '']
        - name: re_replace
          args: ['(?s)^(?![\s\S]*Language)[\s\S]*$', '']
        - name: re_replace
          args: ['\r', '']
        - name: re_replace
          args: ['(?s)(.*(?:Text\s+(#\d+)?.*?(?:Language[^\n]+))).*', "$1\n"]
        - name: re_replace
          args: ['(?s).*?(Text\s+(#\d+)?.*?(?:Language[^\n]+))', "\n$1"]
        - name: re_replace
          args: ['(?m)^(?!.*\bLanguage\b).*\n', '']
        - name: re_replace
          args: ['(?s)^(?!.*Language\s*:).*|Language\s*:\s*', '']
        - name: re_replace
          args: ['^\s+|\s+$', '']
        - name: re_replace
          args: ['(?i)\b(PT[-_. ]?BR|BR[-_. ]?PT|Portugu[eê]s\s*Brasil(?:eiro)?|Brazilian\s*Portuguese|Portuguese\s*BR|Portuguese-BR)\b', 'Portuguese (Brazil)']
        - name: re_replace
          args: ['(?i)\b(ES[-_. ]?LA|LATAM|Latin\s*American\s*Spanish|Spanish\s*Latino|Spanish\s*\(Latin\s*America\))\b', 'Spanish (Latino)']
        - name: re_replace
          args: ['(?i)(JA[-_. ]?JP|JPN|Japanese\s*\(Japan\)|Japon[eê]s|日本語)', 'Japanese']
        - name: re_replace
          args: ['(?i)((?:Portuguese\s*\(Brazil\)|Spanish\s*\(Latino\)|French\s*\(Canada\)|Chinese\s*\(Simplified\)|Chinese\s*\(Traditional\)|Norwegian\s*Bokm[aå]l|Norwegian\s*Nynorsk|English\s*\(US\)|English\s*\(GB\)|English\s*\(UK\)|\w+)).*', '$1']
        - name: re_replace
          args: ['(?i)English\s*\((?:US|GB|UK)\)', 'English']
        - name: re_replace
          args: ['(?i)\bPortuguese\b(?!\s*\((?:Brazil|Portugal)\))', 'Portuguese (Brazil)']
        - name: re_replace
          args: ['[\n]+', ', ']
        - name: re_replace
          args: ['\b([^,]+)(?:,\s*\1)+', '$1']

    languages_title_all:
      text: '{{ .Result.languages }}'
      filters:
        # Mapeamento para termos que o Radarr/Sonarr e seus Custom Formats entendem melhor.
        - name: re_replace
          args: ['(?i)Portuguese\s*\(Brazil\)', 'Brazilian']
        - name: re_replace
          args: ['(?i)Portuguese\s*\(Portugal\)', 'Portuguese']
        - name: re_replace
          args: ['(?i)Spanish\s*\(Latino\)', 'Spanish Latino']
        - name: re_replace
          args: ['(?i)French\s*\(Canada\)', 'French Canadian']
        - name: re_replace
          args: ['(?i)Chinese\s*\(Simplified\)', 'Chinese Simplified']
        - name: re_replace
          args: ['(?i)Chinese\s*\(Traditional\)', 'Chinese Traditional']
        - name: re_replace
          args: ['(?i)Japanese\s*\(Japan\)', 'Japanese']
        - name: re_replace
          args: ['\b([^,]+)(?:,\s*\1)+', '$1']
        - name: re_replace
          args: ['^,\s*|,\s*$', '']

    languages_title_br_en_jp:
      text: '{{ .Result.languages_title_all }}'
      filters:
        # Mantém no título só Brazilian/English/Japanese.
        # O áudio completo continua aparecendo na description.
        - name: re_replace
          args: ['(?i)(?:^|,)(?!\s*(?:Brazilian|English|Japanese)\s*(?:,|$))\s*[^,]*', '']
        - name: re_replace
          args: ['\s*,\s*,+', ', ']
        - name: re_replace
          args: ['^,\s*|,\s*$', '']
        - name: re_replace
          args: ['\s*,\s*', ', ']

    languages_title_br_en:
      text: '{{ .Result.languages_title_all }}'
      filters:
        # Mantém no título só Brazilian/English.
        # O áudio completo continua aparecendo na description.
        - name: re_replace
          args: ['(?i)(?:^|,)(?!\s*(?:Brazilian|English)\s*(?:,|$))\s*[^,]*', '']
        - name: re_replace
          args: ['\s*,\s*,+', ', ']
        - name: re_replace
          args: ['^,\s*|,\s*$', '']
        - name: re_replace
          args: ['\s*,\s*', ', ']

    languages_title_br:
      text: '{{ .Result.languages_title_all }}'
      filters:
        # Mantém no título só Brazilian.
        - name: re_replace
          args: ['(?i)(?:^|,)(?!\s*(?:Brazilian)\s*(?:,|$))\s*[^,]*', '']
        - name: re_replace
          args: ['\s*,\s*,+', ', ']
        - name: re_replace
          args: ['^,\s*|,\s*$', '']
        - name: re_replace
          args: ['\s*,\s*', ', ']

    languages_title:
      text: '{{ if eq .Config.title_language_mode "none" }}{{ else }}{{ if eq .Config.title_language_mode "br_only" }}{{ .Result.languages_title_br }}{{ else }}{{ if eq .Config.title_language_mode "br_en" }}{{ .Result.languages_title_br_en }}{{ else }}{{ if eq .Config.title_language_mode "br_en_jp" }}{{ .Result.languages_title_br_en_jp }}{{ else }}{{ .Result.languages_title_all }}{{ end }}{{ end }}{{ end }}{{ end }}'

    languages_suffix:
      text: '{{ .Result.languages_title }}'
      filters:
        - name: re_replace
          args: ['^\s+|\s+$', '']
        - name: re_replace
          args: ['^([A-Za-z])', ' / $1']

    category:
      selector: category_id
    title_optional:
      selector: name
    title_filename:
      selector: "files[0].name"
      optional: true
    files:
      selector: num_file
    title:
      text: "{{ if and (.Config.use_single_file_release_use_filename) (eq .Result.files \"1\") (.Result.title_filename) }}{{ .Result.title_filename }}{{ else }}{{ .Result.title_optional }}{{ end }}{{ .Result.languages_suffix }}"
    details:
      selector: details_link
    download:
      selector: download_link
    infohash:
      selector: info_hash
      optional: true
    poster:
      selector: meta.poster
      filters:
        - name: replace
          args: ["https://via.placeholder.com/90x135", ""]
    imdbid:
      selector: imdb_id
    tmdbid:
      selector: tmdb_id
    tvdbid:
      selector: tvdb_id
    genre:
      selector: meta.genres
      filters:
        - name: re_replace
          args: ["(?i)(Ficção científica)", "Ficção_científica"]
        - name: re_replace
          args: ["(?i)(Cinema TV)", "Cinema_TV"]
        - name: replace
          args: [" & ", "_&_"]
    _internal:
      selector: internal
      case:
        False: "{{ .False }}"
        True: "{{ .True }}"
    description:
      text: "{{ if .Result._internal }}Internal{{ else }}{{ end }}{{ if and .Result._internal .Result.genre }} | {{ else }}{{ end }}{{ .Result.genre }}{{ if .Result.languages_title_all }} | Audio: {{ .Result.languages_title_all }}{{ else }}{{ end }}{{ if .Result.subs }} | Subs: {{ .Result.subs }}{{ else }}{{ end }}"
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    grabs:
      selector: times_completed
    date:
      # "created_at": "2021-10-18T00:34:50.000000Z" is returned by Newtonsoft.Json.Linq as 18/10/2021 00:34:50
      selector: created_at
      filters:
        - name: append
          args: " -03:00" # BRT
        - name: dateparse
          args: "MM/dd/yyyy HH:mm:ss zzz"
    size:
      selector: size
    _featured:
      selector: featured
      case:
        False: "{{ .False }}"
        True: "{{ .True }}"
    downloadvolumefactor_freeleech:
      # api returns 0%, 25%, 50%, 75%, 100%
      selector: freeleech
      case:
        0%: 1 # not free
        25%: 0.75
        50%: 0.5
        75%: 0.25
        100%: 0 # freeleech
        "*": 0 # catch errors
    downloadvolumefactor:
      text: "{{ if .Result._featured }}0{{ else }}{{ .Result.downloadvolumefactor_freeleech }}{{ end }}"
    uploadvolumefactor_double_upload:
      # api returns False, True
      selector: double_upload
      case:
        False: 1 # normal
        True: 2 # double
    uploadvolumefactor:
      text: "{{ if .Result._featured }}2{{ else }}{{ .Result.uploadvolumefactor_double_upload }}{{ end }}"
    # global MR is 1.0 but torrents must be seeded for 7 days regardless of ratio
    # minimumratio:
    #   text: 1.0
    minimumseedtime:
      # 7 days (as seconds = 7 x 24 x 60 x 60)
      text: 604800
